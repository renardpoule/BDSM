name: Mise à jour du nombre de joueurs

on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches-ignore:
      - data
  workflow_dispatch:
    inputs:
      combler:
        description: "Combler les trous de l'historique avec des points estimés"
        type: boolean
        default: false

permissions:
  actions: write
  contents: write
  pages: write
  id-token: write

jobs:
  # Il arrive que GitHub ne trouve jamais de machine pour un lancement : il reste « en attente »
  # et bloque tous les suivants. Chaque lancement annule donc ceux bloqués depuis plus de 10 minutes.
  debloquer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Annuler les lancements bloqués
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          limite=$(date -u -d '10 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          for etat in queued in_progress; do
            for id in $(gh api "repos/$REPO/actions/workflows/pages.yml/runs?status=$etat&per_page=50" --jq '.workflow_runs[].id'); do
              [ "$id" = "${{ github.run_id }}" ] && continue
              bloques=$(gh api "repos/$REPO/actions/runs/$id/jobs" \
                --jq "[.jobs[] | select(.status == \"queued\" and (.runner_name // \"\") == \"\" and .created_at < \"$limite\")] | length")
              if [ "$bloques" -gt 0 ]; then
                echo "Lancement $id bloqué sans machine depuis plus de 10 minutes : annulation."
                gh api -X POST "repos/$REPO/actions/runs/$id/cancel" \
                  || gh api -X POST "repos/$REPO/actions/runs/$id/force-cancel" || true
              fi
            done
          done

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Les relevés passent l'un après l'autre pour ne jamais perdre un point de l'historique
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # L'historique est gardé dans la branche "data" (un seul commit, réécrit à chaque fois)
      - name: Récupérer l'historique
        run: |
          set +e
          git ls-remote --exit-code --heads origin data > /dev/null
          code=$?
          set -e
          if [ "$code" = 0 ]; then
            git fetch --depth=1 origin data
            git show FETCH_HEAD:history.csv > public/history.csv
            echo "LINES_BEFORE=$(wc -l < public/history.csv)" >> "$GITHUB_ENV"
          elif [ "$code" = 2 ]; then
            echo "Pas encore d'historique, il sera créé."
            echo "LINES_BEFORE=0" >> "$GITHUB_ENV"
          else
            echo "Impossible de lire la branche data, on s'arrête pour ne rien écraser."
            exit 1
          fi

      - name: Combler les trous
        if: inputs.combler
        run: node scripts/fill-gaps.js

      - run: node scripts/update-status.js

      - name: Sauvegarder l'historique
        run: |
          test "$(wc -l < public/history.csv)" -gt "$LINES_BEFORE"
          dir=$(mktemp -d)
          cp public/history.csv "$dir/"
          cd "$dir"
          git init -q -b data
          git add history.csv
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Historique du nombre de joueurs"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data

      # GitHub désactive les tâches planifiées après 60 jours sans activité sur le dépôt :
      # les réactiver à chaque passage remet ce compteur à zéro.
      - name: Garder la tâche planifiée active
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/pages.yml/enable"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
