<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nombre de joueurs</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000;
      color: #fff;
      font-family: system-ui, sans-serif;
      text-align: center;
    }
    p { font-size: 1.5rem; margin: 0; }
    #players { font-size: 10rem; font-weight: bold; line-height: 1.1; }
  </style>
</head>
<body>
  <p>Nombre de joueurs :</p>
  <div id="players">…</div>
  <script>
    async function refresh() {
      try {
        const s = await (await fetch('status.json?t=' + Date.now())).json();
        document.getElementById('players').textContent = s.online ? s.players : 'Hors ligne';
      } catch {
        document.getElementById('players').textContent = '?';
      }
    }
    refresh();
    setInterval(refresh, 30000);
  </script>
</body>
</html>
