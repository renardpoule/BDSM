<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nombre de joueurs</title>
  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: system-ui, sans-serif;
      text-align: center;
    }
    .top {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    p { font-size: 1.5rem; margin: 0; }
    #players { font-size: 10rem; font-weight: bold; line-height: 1.1; }
    ul { list-style: none; margin: 0 auto; padding: 0 16px 48px; max-width: 500px; }
    li { display: flex; justify-content: space-between; gap: 16px; padding: 10px 0; border-bottom: 1px solid #333; font-size: 1.1rem; }
    li span:first-child { text-align: left; word-break: break-word; }
    li span:last-child { color: #888; white-space: nowrap; }
  </style>
</head>
<body>
  <div class="top">
    <p>Nombre de joueurs :</p>
    <div id="players">…</div>
  </div>
  <ul id="list"></ul>
  <script>
    function duree(sec) {
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      return h > 0 ? `${h} h ${String(m).padStart(2, '0')}` : `${m} min`;
    }

    async function refresh() {
      try {
        const s = await (await fetch('status.json?t=' + Date.now())).json();
        document.getElementById('players').textContent = s.online ? s.players : 'Hors ligne';
        const rows = (s.online && s.playerList || []).map((p) => {
          const li = document.createElement('li');
          const name = document.createElement('span');
          name.textContent = p.name;
          const time = document.createElement('span');
          time.textContent = duree(p.duration);
          li.append(name, time);
          return li;
        });
        document.getElementById('list').replaceChildren(...rows);
      } catch {
        document.getElementById('players').textContent = '?';
      }
    }
    refresh();
    setInterval(refresh, 30000);
  </script>
</body>
</html>
